name: beyond_borders
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: '>=3.6.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  http: ^1.2.2
  flutter_dotenv: ^5.1.0
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  lottie: ^3.3.2

  # ---- Firebase (latest compatible set) ----
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.3
  cloud_firestore: ^5.6.7
  firebase_storage: ^12.4.5
  firebase_database: ^11.3.5
  # firebase_dynamic_links removed - package discontinued

  # ---- Device / Media ----
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  image: ^4.2.0

  # ---- Location ----
  geolocator: ^10.1.1
  geocoding: ^3.0.0

  # ---- Utilities ----
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  shared_preferences: ^2.3.2
  permission_handler: ^11.0.0
  email_validator: ^2.1.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2


flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/icons/arrow_left.svg
    - assets/icons/dots.svg
