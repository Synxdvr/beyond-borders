    - assets/icons/statue_of_liberty.svg
    - assets/icons/bbq.svg
    - assets/icons/diving.svg
    - assets/icons/hot_air_balloon.svg
    - assets/icons/hotel.svg
    - assets/icons/photog.svg
    - assets/icons/community.svg
    - assets/icons/flying.svg
    - assets/icons/museum.svg
    - assets/icons/travelling.svg
    - assets/icons/airplane_departure.svg
    - assets/icons/about_icon.svg
    - assets/icons/destination_icon.svg
    - assets/icons/registration_icon.svg
    - assets/icons/home_icon.svg
